name: 検証・リリース
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/file-okiba
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 全配布対象をビルド
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: go run ./scripts/release -version "$RELEASE_VERSION"
      - name: GitHub Releasesへ公開
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --verify-tag --title "$RELEASE_VERSION" --notes 'Go単体実行ファイル。対応環境と使い方は同梱のREADME.mdを参照してください。'
